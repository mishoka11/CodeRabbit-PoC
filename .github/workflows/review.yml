name: AI Code Review PoC

on:
  pull_request:
    branches: [ main ]

jobs:
  code-review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run static analysis (Flake8)
      id: analysis
      run: |
        pip install flake8
        flake8 src --exit-zero > flake8-report.txt
        ISSUE_COUNT=$(grep -c 'src/' flake8-report.txt || true)
        echo "issue_count=$ISSUE_COUNT" >> $GITHUB_OUTPUT
        cat flake8-report.txt

    - name: Generate AI-style feedback (workflow summary)
      run: |
        echo "### 🤖 AI Review Feedback" >> $GITHUB_STEP_SUMMARY
        echo "Detected $(grep -c 'src/' flake8-report.txt) issues via static analysis." >> $GITHUB_STEP_SUMMARY
        echo "- Consider adding type hints and docstrings." >> $GITHUB_STEP_SUMMARY
        echo "- Simplify concatenation using f-strings." >> $GITHUB_STEP_SUMMARY
        echo "- Follow PEP8 line-length and import ordering conventions." >> $GITHUB_STEP_SUMMARY

    - name: Post AI-style comment to PR
      if: github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ### 🤖 AI Code Review Summary
          Detected **${{ steps.analysis.outputs.issue_count }}** issues via static analysis.

          **Recommendations:**
          - Consider adding type hints and docstrings.
          - Simplify concatenation using f-strings.
          - Follow PEP8 line-length and import ordering conventions.

          _This comment was automatically generated by the AI Code Review PoC workflow._
